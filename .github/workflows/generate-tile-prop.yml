name: Generate Tile/Prop assets

on:
  push:
    branches:
      - rebuild-tile-prop-v1
    paths:
      - pix.png
      - scripts/extract_tiles_props.py
      - scripts/wrap_preview.py
      - .github/workflows/generate-tile-prop.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-tile-prop-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pillow numpy
      - name: Generate assets
        run: |
          python scripts/extract_tiles_props.py
          python scripts/wrap_preview.py
      - name: Commit generated PNGs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "assets: generate tile/prop PNGs"
          git push origin HEAD:rebuild-tile-prop-v1

name: Build true Pixelorama redraw v2

on:
  push:
    branches: [rebuild-tile-prop-v1]
    paths:
      - scripts/build_pack_v2.py
      - .github/workflows/pixelorama-redraw-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-tile-prop-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pillow
      - name: Download Pixelorama 1.2.2
        run: |
          curl -L -o /tmp/pixelorama.tar.gz https://github.com/Orama-Interactive/Pixelorama/releases/download/v1.2.2/Pixelorama-Linux-64bit.tar.gz
          mkdir -p /tmp/pixelorama
          tar -xzf /tmp/pixelorama.tar.gz -C /tmp/pixelorama
          find /tmp/pixelorama -name 'Pixelorama.x86_64' -exec chmod +x {} \;
          echo "PIXELORAMA_BIN=$(find /tmp/pixelorama -name 'Pixelorama.x86_64' | head -1)" >> "$GITHUB_ENV"
      - name: Draw assets from blank canvases
        run: python scripts/build_pack_v2.py
      - name: Validate layered ORA files with Pixelorama
        shell: bash
        run: |
          set -e
          rm -rf validated_v2
          for a in tree_round stone_tiles_32 blue_banner fountain; do
            mkdir -p "validated_v2/$a/export" "validated_v2/$a/split"
            "$PIXELORAMA_BIN" --headless --quit -- --export --output "validated_v2/$a/export/$a.png" "redraw/$a/$a.ora"
            "$PIXELORAMA_BIN" --headless --quit -- --export --split-layers --output "validated_v2/$a/split/$a.png" "redraw/$a/$a.ora"
          done
      - name: Verify Pixelorama flattened output matches authored PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          for a in ['tree_round','stone_tiles_32','blue_banner','fountain']:
              authored=Image.open(Path('redraw')/a/f'{a}.png').convert('RGBA')
              exported=Image.open(Path('validated_v2')/a/'export'/f'{a}.png').convert('RGBA')
              if ImageChops.difference(authored, exported).getbbox() is not None:
                  raise SystemExit(f'Pixelorama export mismatch: {a}')
              print('validated', a)
          PY
      - name: Commit generated redraws
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add redraw/ preview/ manifest_v2.json validated_v2/
          if git diff --cached --quiet; then
            echo "No redraw changes"
            exit 0
          fi
          git commit -m "assets: build true Pixelorama redraw v2"
          git push origin HEAD:rebuild-tile-prop-v1
